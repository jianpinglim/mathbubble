<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideKick - Teacher Login</title>
    <link rel="stylesheet" href="/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Prevent Chrome extension errors from breaking the app
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('chrome-extension://')) {
                e.preventDefault();
                e.stopPropagation();
                console.warn('Chrome extension error ignored:', e.message);
                return false;
            }
        }, true);

        // Prevent unhandled promise rejection errors from extensions
        window.addEventListener('unhandledrejection', function(e) {
            const reason = e.reason ? e.reason.toString() : '';
            if (reason.includes('chrome-extension://') || reason.includes('message channel closed')) {
                e.preventDefault();
                e.stopPropagation();
                console.warn('Chrome extension promise rejection ignored:', reason);
                return false;
            }
        });
    </script>
</head>
<body>
    <div class="login-container">
        
        <!-- Login Card -->
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <img src="/images/sidekick_logo.png" alt="SideKick" class="logo-img">
                </div>
                <h1 class="login-title">Teacher Portal</h1>
                <p class="login-subtitle">Sign in as a teacher to manage your classes</p>
            </div>

            <div class="login-content">
                <!-- Error Message -->
                <div id="error-message" class="error-message" style="display: none;"></div>

                <!-- Loading State -->
                <div id="loading-state" class="loading-state" style="display: none;">
                    <div class="loading-spinner"></div>
                    <p>Signing you in...</p>
                </div>

                <!-- Already Signed In State -->
                <div id="already-signed-in" class="already-signed-in" style="display: none;">
                    <div class="signed-in-icon">✅</div>
                    <h3 class="signed-in-title">Already Signed In</h3>
                    <p class="signed-in-message">You're already signed in as <span id="current-user-email">user@email.com</span></p>
                    <div class="signed-in-actions">
                        <button id="go-dashboard-btn" class="primary-action-btn">Go to Dashboard</button>
                        <button id="teacher-sign-out-and-switch-btn" class="secondary-action-btn">Sign Out & Switch Account</button>
                    </div>
                </div>

                <!-- Login Form -->
                <div id="login-form" class="login-form">
                    <button id="teacher-google-login-btn" class="google-login-btn">
                        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>

                    <p class="login-disclaimer">
                        By continuing, you agree to our 
                        <a href="#" class="link">Terms of Service</a> and 
                        <a href="#" class="link">Privacy Policy</a>
                    </p>
                </div>

                <!-- Back Link -->
                <div class="back-link-container">
                    <a href="/login" class="back-link">← Back to Student Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/auth.js"></script>
    <script>
        // Teacher login handler
        let supabaseClient;

        document.addEventListener('DOMContentLoaded', async () => {
            await initializeSupabase();
            supabaseClient = window.supabaseClient;

            if (!supabaseClient) {
                console.error('Supabase client not initialized');
                return;
            }

            // Check real-time auth state
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                checkAndShowUserStatus(session.user.email);
            }

            // Listen for auth changes
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
                    checkAndShowUserStatus(session.user.email);
                } else if (!session) {
                    showLoginForm();
                }
            });

            setupGoogleLogin();
        });

        function setupGoogleLogin() {
            const googleLoginBtn = document.getElementById('teacher-google-login-btn');
            googleLoginBtn.addEventListener('click', async () => {
                performGoogleLogin();
            });
        }

        async function performGoogleLogin() {
            const loadingState = document.getElementById('loading-state');
            const loginForm = document.getElementById('login-form');

            loadingState.style.display = 'flex';
            loginForm.style.display = 'none';

            try {
                // Flag so auth.js knows to redirect to /teacher after OAuth
                sessionStorage.setItem('pendingTeacherRedirect', '1');

                const { data, error: signInError } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}`
                    }
                });

                if (signInError) {
                    sessionStorage.removeItem('pendingTeacherRedirect');
                    showError('Failed to sign in with Google');
                    loadingState.style.display = 'none';
                    loginForm.style.display = 'flex';
                }
            } catch (error) {
                sessionStorage.removeItem('pendingTeacherRedirect');
                showError('An error occurred during login');
                loadingState.style.display = 'none';
                loginForm.style.display = 'flex';
            }
        }

        async function checkAndShowUserStatus(email) {
            const user = (await supabaseClient.auth.getUser()).data.user;
            
            if (!user) return;

            // Check if user is a teacher
            const { data: userData, error } = await supabaseClient
                .from('users')
                .select('role')
                .eq('id', user.id)
                .single();

            if (error || !userData || userData.role !== 'teacher') {
                // Not a teacher, show error and sign out
                showError('Only teachers can access the teacher portal. Please sign in with a teacher account.');
                setTimeout(() => {
                    supabaseClient.auth.signOut();
                    showLoginForm();
                }, 2000);
                return;
            }

            // User is a teacher, show dashboard
            showAlreadySignedIn(email);
        }

        function showLoginForm() {
            document.getElementById('login-form').style.display = 'flex';
            document.getElementById('already-signed-in').style.display = 'none';
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }

        function showAlreadySignedIn(email) {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('already-signed-in').style.display = 'block';
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('current-user-email').textContent = email;

            document.getElementById('go-dashboard-btn').onclick = () => {
                window.location.href = '/teacher';
            };

            document.getElementById('teacher-sign-out-and-switch-btn').onclick = async () => {
                await supabaseClient.auth.signOut();
                showLoginForm();
            };
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
